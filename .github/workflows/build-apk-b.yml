name: Build APK-B (Fullscreen Alarm)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web assets -> www
        shell: powershell
        run: |
          $root = $PWD
          cd apk-b
          if (Test-Path www) { Remove-Item -Recurse -Force www }
          New-Item -ItemType Directory -Force www | Out-Null
          Copy-Item "$root\index.html","$root\manifest.webmanifest","$root\sw.js" -Destination www
          Copy-Item "$root\css","$root\js","$root\icons" -Recurse -Destination www
          Remove-Item (Join-Path www 'icons\make_icons.py') -ErrorAction SilentlyContinue

      - name: Install dependencies
        working-directory: apk-b
        run: npm install

      - name: Add Android platform
        working-directory: apk-b
        run: npx cap add android

      - name: Inject fullscreen alarm plugin
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File apk-b/inject-plugin.ps1

      - name: Sync Capacitor
        working-directory: apk-b
        run: npx cap sync android

      - name: Build debug APK
        working-directory: apk-b/android
        run: .\gradlew.bat assembleDebug

      - name: Upload APK-B artifact
        uses: actions/upload-artifact@v4
        with:
          name: schedule-app-b-apk
          path: apk-b/android/app/build/outputs/apk/debug/app-debug.apk
