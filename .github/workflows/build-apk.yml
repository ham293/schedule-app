name: Build APK

# 上传/提交即自动编译；也可在 Actions 页手动 "Run workflow"
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web assets
        run: |
          cd apk
          mkdir -p www
          cp ../index.html ../manifest.webmanifest ../sw.js www/
          cp -r ../css ../js ../icons www/

      - name: Install dependencies
        working-directory: apk
        run: npm install

      - name: Add Android platform
        working-directory: apk
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: apk
        run: npx cap sync android

      - name: Add alarm sound to res/raw
        run: |
          mkdir -p apk/android/app/src/main/res/raw
          cp apk/res-raw/schedule_alarm.wav apk/android/app/src/main/res/raw/

      - name: Build debug APK
        working-directory: apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: schedule-app-apk
          path: apk/android/app/build/outputs/apk/debug/app-debug.apk
